name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff check)
        run: ruff check backend/tests backend/app
      - name: Lint (ruff format --check)
        run: ruff format --check backend/tests backend/app

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install mypy + deps
        run: |
          pip install mypy
          pip install -r backend/requirements.txt
      - name: Typecheck
        run: mypy backend/app --ignore-missing-imports --no-strict-optional

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-timeout httpx
      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -x -q --timeout=60
        env:
          JALORA_ENV: test
          JALORA_REDIS_URL: redis://localhost:6379/0
          JALORA_RATE_LIMIT_AUTH_PER_MIN: 1000

  build-and-e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install frontend dependencies and build
        working-directory: frontend-react
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build Docker image
        run: |
          docker build -t jalora:test .
      - name: Install Playwright browser
        run: |
          cd frontend-react
          npx playwright install --with-deps chromium
      - name: Run browser acceptance
        working-directory: frontend-react
        run: npx playwright test --project=chromium
        env:
          JALORA_ENV: test
